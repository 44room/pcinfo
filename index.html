<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PC Info Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Meiryo", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 18px 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,.3);
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
  .big { font-size: 30px; font-weight: 700; color: var(--accent); }
  .unit { font-size: 14px; color: var(--muted); margin-left: 4px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.6; }
  .chart-wrap { position: relative; height: 260px; }
  .mem-chart-wrap { position: relative; height: 220px; }
  .status { font-size: 12px; color: var(--muted); margin-top: 16px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#22c55e; margin-right:6px; }
  .dot.off { background:#ef4444; }
</style>
</head>
<body>
  <h1>PC Info Monitor</h1>
  <div class="sub" id="hostline">読み込み中...</div>

  <div class="grid">
    <div class="card">
      <h2>CPU使用率</h2>
      <div><span class="big" id="cpuVal">--</span><span class="unit">%</span></div>
      <div class="chart-wrap"><canvas id="cpuChart"></canvas></div>
      <div class="meta" id="cpuMeta"></div>
    </div>

    <div class="card">
      <h2>メモリ使用率</h2>
      <div><span class="big" id="memVal">--</span><span class="unit">%</span></div>
      <div class="mem-chart-wrap"><canvas id="memChart"></canvas></div>
      <div class="meta" id="memMeta"></div>
    </div>
  </div>

  <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">接続中...</span></div>

<script>
const MAX_POINTS = 60; // 直近60秒分の縦棒を表示

// ---- CPU: vertical bar chart (time series) ----
const cpuCtx = document.getElementById('cpuChart').getContext('2d');
const cpuChart = new Chart(cpuCtx, {
  type: 'bar',
  data: {
    labels: Array(MAX_POINTS).fill(''),
    datasets: [{
      label: 'CPU %',
      data: Array(MAX_POINTS).fill(0),
      backgroundColor: '#38bdf8',
      borderRadius: 2,
      barPercentage: 1.0,
      categoryPercentage: 0.9,
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    scales: {
      y: { min: 0, max: 100, ticks: { color: '#94a3b8', callback: v => v + '%' }, grid: { color: 'rgba(148,163,184,.15)' } },
      x: { ticks: { display: false }, grid: { display: false } }
    },
    plugins: { legend: { display: false }, tooltip: { enabled: false } }
  }
});

// ---- Memory: doughnut (pie) chart ----
const memCtx = document.getElementById('memChart').getContext('2d');
const memChart = new Chart(memCtx, {
  type: 'doughnut',
  data: {
    labels: ['使用中', '空き'],
    datasets: [{
      data: [0, 100],
      backgroundColor: ['#f97316', '#334155'],
      borderColor: '#1e293b',
      borderWidth: 2,
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    cutout: '62%',
    plugins: {
      legend: { position: 'bottom', labels: { color: '#94a3b8', boxWidth: 12, padding: 14 } }
    }
  }
});

function fmtBytes(n) {
  const gb = n / (1024 ** 3);
  return gb.toFixed(1) + ' GB';
}

function setStatus(ok, text) {
  document.getElementById('statusDot').className = ok ? 'dot' : 'dot off';
  document.getElementById('statusText').textContent = text;
}

async function tick() {
  try {
    const res = await fetch('/api/stats', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const s = await res.json();

    // CPU
    const cpu = s.cpu.total;
    document.getElementById('cpuVal').textContent = cpu.toFixed(1);
    cpuChart.data.datasets[0].data.push(cpu);
    cpuChart.data.datasets[0].data.shift();
    // 使用率に応じて色を変える
    cpuChart.data.datasets[0].backgroundColor = cpuChart.data.datasets[0].data.map(
      v => v >= 85 ? '#ef4444' : v >= 60 ? '#f59e0b' : '#38bdf8'
    );
    cpuChart.update();
    document.getElementById('cpuMeta').textContent =
      `論理 ${s.cpu.logical_count} コア / 物理 ${s.cpu.physical_count} コア` +
      (s.cpu.freq_mhz ? ` ・ ${(s.cpu.freq_mhz/1000).toFixed(2)} GHz` : '');

    // Memory
    const m = s.memory;
    document.getElementById('memVal').textContent = m.percent.toFixed(1);
    memChart.data.datasets[0].data = [m.used, m.available];
    memChart.update();
    document.getElementById('memMeta').textContent =
      `使用 ${fmtBytes(m.used)} / 全体 ${fmtBytes(m.total)} ・ 空き ${fmtBytes(m.available)}`;

    document.getElementById('hostline').textContent = `ホスト: ${s.host}`;
    setStatus(true, '接続中 ・ 1秒ごとに更新');
  } catch (e) {
    setStatus(false, '切断 (' + e.message + ') - 再試行中');
  }
}

tick();
setInterval(tick, 1000); // 1秒ごとに更新
</script>
</body>
</html>
